[project]
name = "futures-scan"
version = "0.1.0"
description = "RSI + volume-spike scanner for crypto perpetual futures, with charts, backtest, and replay"
authors = [
    { name = "Seongil Park", email = "zihado@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyarrow>=16.0.0",
]

[project.scripts]
futures-scan = "futures_scan.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
